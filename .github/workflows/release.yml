name: Release

# Runs only on a version tag (git tag v0.1.0 && git push origin v0.1.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in package.json apps/server/package.json packages/cli/package.json; do
            version="$(bun -e "console.log(require('./$file').version)")"
            test "$version" = "$tag" || { echo "$file is $version, tag is $tag"; exit 1; }
          done

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip when NPM_TOKEN is not configured
        if: env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set; skipping npm publish. Add the secret and re-run this job."
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.NPM_TOKEN != ''
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
        if: env.NPM_TOKEN != ''
      - run: bun run --cwd packages/cli build
        if: env.NPM_TOKEN != ''
      - run: npm publish --provenance --access public
        if: env.NPM_TOKEN != ''
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
