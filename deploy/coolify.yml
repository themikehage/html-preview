# documentation: https://github.com/themikehage/html-preview/blob/main/docs/self-hosting.md
# slogan: Self-hosted, agent-first static HTML previews.
# tags: html,preview,static,mcp,agents
# port: 3000
#
# Coolify one-click template (Docker Compose). One service, two domains:
#   - Put both domains in the service's "Domains" field (comma separated, port 3000).
#   - Set APP_ORIGIN (API / MCP / dashboard) and CONTENT_ORIGIN (untrusted content) to
#     them explicitly. They MUST be different hosts. SERVICE_FQDN_* is not used for the
#     origins because with two domains it holds both.
services:
  htmlpreview:
    image: ghcr.io/themikehage/html-preview:${HTML_PREVIEW_VERSION:-latest}
    environment:
      - SERVICE_FQDN_HTMLPREVIEW_3000
      - APP_ORIGIN=${APP_ORIGIN:?}
      - CONTENT_ORIGIN=${CONTENT_ORIGIN:?}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - SIGNING_SECRET=${SERVICE_PASSWORD_64_SIGNING}
      - MAX_VISIBILITY=${MAX_VISIBILITY:-unlisted}
      - DEFAULT_TTL_HOURS=${DEFAULT_TTL_HOURS:-168}
    volumes:
      - htmlpreview-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const host = new URL(process.env.APP_ORIGIN).host; const r = await fetch('http://127.0.0.1:3000/healthz', { headers: { host } }); process.exit(r.ok ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
